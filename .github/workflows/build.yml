name: Build and Publish to NuGet

on:
  push:
    branches:
      - nuget
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore template solutions
        run: |
          dotnet restore ApiStandard/MyProjectName.slnx
          dotnet restore MiniApi/MyProjectName.slnx
          dotnet restore Pack.csproj

      - name: Build template solutions
        run: |
          dotnet build ApiStandard/MyProjectName.slnx --configuration Release --no-restore
          dotnet build MiniApi/MyProjectName.slnx --configuration Release --no-restore

      - name: Run ApiStandard unit tests
        working-directory: ApiStandard
        run: dotnet test --project tests/UnitTest/UnitTest.csproj --configuration Release --no-restore --no-build

      - name: Run MiniApi unit tests
        working-directory: MiniApi
        run: dotnet test --project tests/UnitTest/UnitTest.csproj --configuration Release --no-restore --no-build

      - name: Pack NuGet package
        run: dotnet pack Pack.csproj -c Release --output ./artifacts --no-restore

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
