name: Publish SourceGeneration 1.1.2
on:
  push:
    branches:
      - dev/sourcegen-1.1.2-release
jobs:
  publish-source-generation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Pack SourceGeneration 1.1.2
        run: dotnet pack MiniApi/src/Perigon/Perigon.AspNetCore.SourceGeneration/Perigon.AspNetCore.SourceGeneration.csproj -c Release -o ./artifacts
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish SourceGeneration only
        run: dotnet nuget push ./artifacts/Perigon.AspNetCore.SourceGeneration.1.1.2.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
